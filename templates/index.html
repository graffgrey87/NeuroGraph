<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroGraph Пульт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: var(--tg-theme-bg-color, #1e1e1e); color: var(--tg-theme-text-color, #ffffff); font-family: sans-serif; padding: 15px; margin: 0; }
        .block { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--tg-theme-hint-color, #aaaaaa); font-size: 14px; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--tg-theme-secondary-bg-color, #2c2c2c); color: var(--tg-theme-text-color, #ffffff); font-size: 16px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 14px; background-color: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="block">
        <label>Разрешение</label>
        <select id="aspect">
            <option value="1024x1024 (Square)">1024x1024 (Square)</option>
            <option value="832x1216 (Portrait)">832x1216 (Portrait)</option>
            <option value="1216x832 (Landscape)">1216x832 (Landscape)</option>
            <option value="704x1408 (Mobile)">704x1408 (Mobile)</option>
            <option value="1408x704 (Cinema)">1408x704 (Cinema)</option>
        </select>
    </div>
    <div class="block">
        <label>Вращение камеры</label>
        <select id="cam_rot">
            <option value="0">0 - Отключено</option>
            <option value="1">1 - Front</option>
            <option value="2">2 - 3/4</option>
            <option value="3">3 - Side</option>
            <option value="4">4 - Rear</option>
        </select>
    </div>
    <div class="block">
        <label>Угол камеры</label>
        <select id="cam_angle">
            <option value="Straight">Straight</option>
            <option value="High angle">High angle</option>
            <option value="Low angle">Low angle</option>
        </select>
    </div>
    <div class="block">
        <label>Дистанция</label>
        <select id="cam_dist">
            <option value="Full body">Full body</option>
            <option value="Close up">Close up</option>
        </select>
    </div>
    <button id="save_btn">Применить</button>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем пульт на весь экран

        // Парсинг параметров
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        const API_BASE = window.location.origin;

        // Элементы
        const elAspect = document.getElementById('aspect');
        const elRot = document.getElementById('cam_rot');
        const elAngle = document.getElementById('cam_angle');
        const elDist = document.getElementById('cam_dist');
        const btnSave = document.getElementById('save_btn');

        // Загрузка настроек с сервера
        async function loadSettings() {
            if (!uid) return;
            try {
                const res = await fetch(`${API_BASE}/api/settings/${uid}`);
                const data = await res.json();
                
                if (data.aspect) elAspect.value = data.aspect;
                if (data.camera_rotation !== undefined) elRot.value = data.camera_rotation;
                if (data.camera_angle) elAngle.value = data.camera_angle;
                if (data.camera_distance) elDist.value = data.camera_distance;
            } catch (err) {
                console.error("Ошибка загрузки:", err);
            }
        }

        // Сохранение и передача боту
        btnSave.addEventListener('click', async () => {
            const config = {
                aspect: elAspect.value,
                camera_rotation: parseInt(elRot.value),
                camera_angle: elAngle.value,
                camera_distance: elDist.value
            };

            // Сохраняем на бэкенд
            if (uid) {
                try {
                    await fetch(`${API_BASE}/api/settings/${uid}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });
                } catch (err) {
                    console.error("Ошибка сохранения:", err);
                }
            }

            // Отправляем в бота для закрытия окна
            tg.sendData(JSON.stringify(config));
        });

        // Старт
        window.addEventListener('load', loadSettings);
    </script>
</body>
</html>

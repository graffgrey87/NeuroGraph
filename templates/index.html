<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flux Settings</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            color: var(--tg-theme-text-color, #ffffff);
        }

        .section {
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2e);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--tg-theme-hint-color, #8e8e93);
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-bg-color);
            background-color: var(--tg-theme-bg-color, #000);
            color: var(--tg-theme-text-color, #fff);
            font-size: 16px;
            appearance: none; /* Убирает стандартную стрелку браузера */
            outline: none;
        }

        /* Ползунок веса */
        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }
        
        input[type="range"] {
            flex-grow: 1;
            margin-right: 15px;
            accent-color: var(--tg-theme-button-color, #3390ec);
        }

        .value-badge {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 14px;
            min-width: 30px;
            text-align: center;
        }

        /* Главная кнопка */
        #main-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        #main-btn:active {
            opacity: 0.8;
        }

        /* Анимация загрузки */
        .loader {
            text-align: center;
            color: var(--tg-theme-hint-color);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>⚙️ Flux Настройки</h2>

    <div class="section">
        <label for="checkpoint">Checkpoint (Модель)</label>
        <select id="checkpoint">
            <option value="" disabled selected>🔄 Загрузка списка...</option>
        </select>
    </div>

    <div class="section">
        <label for="lora_1">LoRA (Стиль/Персонаж)</label>
        <select id="lora_1">
            <option value="None">Loading...</option>
        </select>

        <div class="slider-row">
            <input type="range" id="weight_1" min="0" max="2" step="0.1" value="1.0" oninput="updateVal('val_1', this.value)">
            <span id="val_1" class="value-badge">1.0</span>
        </div>
    </div>

    <button id="main-btn" onclick="sendData()">ГЕНЕРИРОВАТЬ</button>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Раскрыть на весь экран

        // Обновление цифр ползунка
        function updateVal(id, val) {
            document.getElementById(id).innerText = val;
        }

        // Загрузка данных с нашего сервера Python
        async function loadData() {
            try {
                // 1. Загружаем Checkpoints
                let resCkpt = await fetch('/api/checkpoints');
                let dataCkpt = await resCkpt.json();
                
                let ckptSelect = document.getElementById('checkpoint');
                ckptSelect.innerHTML = ""; // Очистить "Загрузка..."

                if (dataCkpt.checkpoints && dataCkpt.checkpoints.length > 0) {
                    dataCkpt.checkpoints.forEach(model => {
                        let opt = document.createElement('option');
                        opt.value = model;
                        opt.innerText = model;
                        // Автовыбор Flux, если есть в названии
                        if (model.toLowerCase().includes("flux") || model.toLowerCase().includes("klein")) {
                            opt.selected = true;
                        }
                        ckptSelect.appendChild(opt);
                    });
                } else {
                    let opt = document.createElement('option');
                    opt.innerText = "❌ Модели не найдены";
                    ckptSelect.appendChild(opt);
                }

                // 2. Загружаем LoRAs
                let resLora = await fetch('/api/loras');
                let dataLora = await resLora.json();
                
                let loraSelect = document.getElementById('lora_1');
                loraSelect.innerHTML = '<option value="None">⛔ Без Лоры (None)</option>';

                if (dataLora.loras && dataLora.loras.length > 0) {
                    dataLora.loras.forEach(lora => {
                        let opt = document.createElement('option');
                        opt.value = lora;
                        opt.innerText = lora;
                        loraSelect.appendChild(opt);
                    });
                }

            } catch (error) {
                alert("Ошибка соединения с сервером: " + error);
            }
        }

        // Отправка данных боту
        function sendData() {
            let checkpoint = document.getElementById('checkpoint').value;
            let lora_1 = document.getElementById('lora_1').value;
            let weight_1 = document.getElementById('weight_1').value;

            if (!checkpoint || checkpoint.includes("Модели не найдены")) {
                tg.showPopup({title: 'Ошибка', message: 'Выберите модель!'});
                return;
            }

            let data = {
                checkpoint: checkpoint,
                lora_1: lora_1,
                weight_1: weight_1
            };

            // Отправляем JSON боту
            tg.sendData(JSON.stringify(data));
        }

        // Запускаем при загрузке страницы
        loadData();

    </script>
</body>
</html>
